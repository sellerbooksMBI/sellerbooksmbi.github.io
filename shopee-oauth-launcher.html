<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SellerBooks - Login Shopee</title></head>
<body style="font-family:Arial,sans-serif;padding:40px;text-align:center;color:#334155">
<h2 id="title">Menyiapkan koneksi Shopee...</h2><p id="msg">Mohon tunggu, SellerBooks sedang membuka autentikasi resmi Shopee.</p>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(async function(){
 const msg=document.getElementById("msg"), title=document.getElementById("title");
 const url=new URL(location.href);
 const storeId=url.searchParams.get("store_id")||"", marketplaceId=url.searchParams.get("marketplace_id")||"";
 const SUPABASE_URL="https://vrgiwzxwnfjhpmxcahwo.supabase.co";
 const SUPABASE_KEY="sb_publishable_8Q1xJ_6ji1DqPvbS1GrP-Q_gV9_n3FB";
 try{
  if(!storeId||!marketplaceId) throw new Error("Store ID atau Marketplace ID tidak tersedia.");
  const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  const s=await sb.auth.getSession();
  const token=s?.data?.session?.access_token||"";
  if(!token) throw new Error("Sesi SellerBooks tidak ditemukan. Silakan login kembali.");
  const r=await fetch(SUPABASE_URL+"/functions/v1/sellerbooks-shopee-oauth?action=init",{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY,"Authorization":"Bearer "+token},body:JSON.stringify({store_id:storeId,marketplace_id:marketplaceId})});
  const raw=await r.text(); let d=null; try{d=JSON.parse(raw)}catch(e){}
  if(!r.ok) throw new Error(d?.error||raw||("HTTP "+r.status));
  if(!d?.authorization_url) throw new Error(d?.error||"URL autentikasi Shopee tidak diterima.");
  title.textContent="Membuka Shopee...";
  msg.textContent="Anda akan diarahkan ke halaman resmi Shopee.";
  location.replace(d.authorization_url);
 }catch(e){
  title.textContent="Login Shopee gagal dimulai";
  msg.textContent=String(e?.message||e);
 }
})();
</script>
</body></html>
